name = "qwen-scanner"
main = "src/index.js"
compatibility_date = "2026-05-01"

[assets]
directory = "./public"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "qwen_scanner"
database_id = "da86e390-bf90-4e29-b7df-ea903729c967"

[triggers]
crons = ["*/5 * * * *"]

[vars]
DEFAULT_REFRESH_HOURS = "24"
SEARCH_QUERIES_PER_TICK = "3"
VERIFIES_PER_TICK = "8"
MAX_SUBREQUESTS_PER_TICK = "28"
FETCH_TIMEOUT_MS = "9000"
